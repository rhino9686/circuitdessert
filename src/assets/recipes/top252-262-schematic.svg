<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 60 980 540" role="img" aria-labelledby="top252-262-t top252-262-d" style="min-width:900px">
<title id="top252-262-t">TOPSwitch-HX typical flyback application</title>
<desc id="top252-262-d">Typical flyback supply, redrawn from Figure 1 on page 1 of the TOP252-262 datasheet (the V, X and F pin version). The AC input goes through a four-diode bridge to a bulk capacitor across the bus. The bus feeds the top of the transformer primary and, through a resistor, the V pin. A clamp of a zener diode in series with a diode runs from the bus to the drain node, where the primary's bottom end and the D pin meet. The S pin and the F pin go to the bridge's negative rail, and the X pin goes to it through a resistor. On the output winding a diode and a capacitor make the DC output. A zener diode, a resistor and a diode in series across the output feed back through an optocoupler. A bias winding feeds the C pin: a diode charges a capacitor, the optocoupler's phototransistor connects that capacitor to the C pin, and a capacitor from the C pin goes to the negative rail.</desc>
