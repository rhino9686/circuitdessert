<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 1000 440" role="img" aria-labelledby="tps63020-2a-t tps63020-2a-d" style="min-width:800px">
<title id="tps63020-2a-t">TPS63020 application circuit for 2 A</title>
<desc id="tps63020-2a-d">Application circuit of the TPS63020 buck-boost converter, redrawn from the datasheet. The input VIN (2.5–5.5 V) feeds the VIN pin and has C1 (2 × 10 µF) to ground. The inductor L1 (1 µH) connects the L1 and L2 pins. The VOUT pin feeds the output (3.3 V at 2 A), which has C2 (4 × 22 µF) to ground. The feedback pin FB is the midpoint of a divider: R1 (1 MΩ) from VOUT and R2 (180 kΩ) to ground. A branch of R4 (68 kΩ) in series with C4 (4.7 pF) also runs from VOUT to FB, in parallel with R1. The pins VINA, EN and PS/SYNC are joined at one node, which has C3 (100 nF) to ground; the datasheet draws no connection from this node to VIN. The open-drain power-good output PG goes to a Power Good terminal, with R3 (1 MΩ) to VOUT. GND and PGND each go to ground.</desc>
