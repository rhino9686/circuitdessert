<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 560 210" role="img" aria-labelledby="sy6813c-t sy6813c-d">
<title id="sy6813c-t">SY6813C reference circuit</title>
<desc id="sy6813c-d">Typical application of the SY6813C load switch, redrawn from Figure 1 of the datasheet. VIN (1.2–5.5 V) feeds the IN pin, with a 1 µF input capacitor CIN to ground. ON is a control input that is driven high to turn the switch on and must not float. OUT feeds the load at VOUT, with a 1 µF output capacitor COUT to ground. The GND pin is connected to ground.</desc>
