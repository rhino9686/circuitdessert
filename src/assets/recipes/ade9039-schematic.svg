<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 860 710" role="img" aria-labelledby="ade9039-t ade9039-d">
<title id="ade9039-t">ADE9039 three-phase meter</title>
<desc id="ade9039-d">Figure 1 of the ADE9039 data sheet, redrawn. Four di/dt current sensors, type ADEMDIDT-DG-DFL0418, each sit in a block with an ADE1139 amplifier that has a 3.3 V supply and a ground. The blocks for phases A, B and C and for the neutral go to the IAP and IAN, IBP and IBN, ICP and ICN, and INP and INN pins. Each phase voltage goes through a resistor divider: the upper resistor runs from the phase line to the VAP, VBP or VCP pin, the lower resistor runs from that pin to the neutral, and the VAN, VBN and VCN pins connect to the neutral. The GND pin is grounded. The clock pins CLKIN and CLKOUT, the RESET pin, the interrupt pins IRQ0 and IRQ1, the pulse pins CF1, CF2, CF3/ZX and CF4/EVENT/DREADY and the SPI pins SS, SCLK, MISO and MOSI have no external parts in the figure.</desc>
