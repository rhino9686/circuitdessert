<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 670 280" role="img" aria-labelledby="sy7070b-t sy7070b-d">
<title id="sy7070b-t">SY7070B typical application</title>
<desc id="sy7070b-d">Typical application of the SY7070B synchronous boost converter with a fixed 2.8 V output, redrawn from the datasheet's Figure 1. The input VIN has a 10 µF capacitor CIN to ground and feeds the IN pin. A 4.7 µH inductor L runs from VIN to the LX pin. The EN pin is driven by an enable signal. The VOUT pin is the 2.8 V output with a 10 µF capacitor COUT to ground, and the GND pin goes to ground.</desc>
