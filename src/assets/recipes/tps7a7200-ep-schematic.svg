<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 900 430" role="img" aria-labelledby="tps7a7200-ep-t tps7a7200-ep-d">
<title id="tps7a7200-ep-t">TPS7A7200-EP typical application circuit</title>
<desc id="tps7a7200-ep-d">Typical application circuit of the TPS7A7200-EP 2 A fast-transient LDO, redrawn from the datasheet's front-page typical application for a 1.5 V input and a 1.2 V output. The input feeds the IN pin with an input capacitor CIN to ground; the EN pin takes the enable signal, and an optional soft-start capacitor CSS goes from the SS pin to ground. The output voltage is set by tying pins to ground: the 100 mV, 200 mV and 400 mV pins are grounded, which adds up to 0.5 V plus 0.7 V, or 1.2 V, and the 50 mV, 800 mV and 1.6 V pins are left open. OUT is the output with an output capacitor COUT to ground. SNS is wired to OUT, and a feed-forward capacitor CFF goes from FB to OUT. PG is the open-drain power-good output. GND goes to ground.</desc>
