<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 270" role="img" aria-labelledby="sy81154u-t sy81154u-d">
<title id="sy81154u-t">SY81154U reference circuit</title>
<desc id="sy81154u-d">Typical application of the SY81154U buck converter. VIN (4.5–18 V) feeds the IN pin through 47 µF and 10 µF input capacitors. A 10 kΩ / 1 MΩ divider from VIN sets the enable level on EN. The 0.1 µF bootstrap capacitor connects BS to LX. LX drives a 2.2 µH inductor to the 3.3 V output, which has 2 output capacitors of 22 µF. RH (100 kΩ) and RL (22.1 kΩ) form the feedback divider to FB, with a 220 pF feedforward capacitor across RH.</desc>
