<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 786 270" role="img" aria-labelledby="sy8113b-t sy8113b-d">
<title id="sy8113b-t">SY8113B reference circuit</title>
<desc id="sy8113b-d">Typical application of the SY8113B buck converter. VIN (4.5–18 V) feeds the IN pin through a 10 µF input capacitor. The EN pin is driven by a EN control signal from the system. The 0.1 µF bootstrap capacitor connects BS to LX. LX drives a 4.7 µH inductor to the 3.3 V output, which has 1 output capacitor of 47 µF. RH (100 kΩ) and RL (22.1 kΩ) form the feedback divider to FB, with a 22 pF feedforward capacitor across RH.</desc>
