<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 806 300" role="img" aria-labelledby="sy21034-t sy21034-d">
<title id="sy21034-t">SY21034 reference circuit</title>
<desc id="sy21034-d">Application schematic of the SY21034 asynchronous buck converter for a 5 V output, redrawn from the datasheet with the values from its bill of materials. VIN (4.5–100 V) feeds the IN pin, with a 22 µF electrolytic capacitor CIN1 and a 2.2 µF ceramic CIN2 to ground. EN is fed from VIN through a jumper (Jump_EN) and 10 kΩ (RENH), with 1 MΩ (RENL) from EN to ground. A 100 nF capacitor CBS in series with a 10 Ω resistor RBS connects BS to LX. LX drives a 47 µH inductor to the 5 V output, and a Schottky diode D (SS320) runs from ground up to the LX node. The output has a 22 µF capacitor COUT. RH (100 kΩ) from the output and RL (13.7 kΩ) to ground form the feedback divider to FB, with a 47 pF feedforward capacitor CFF across RH.</desc>
