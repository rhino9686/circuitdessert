<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 800 346" role="img" aria-labelledby="sy26533-t sy26533-d">
<title id="sy26533-t">SY26533 reference circuit</title>
<desc id="sy26533-d">Typical schematic of the SY26533 boost converter, redrawn from the datasheet. The input VIN (5–12 V) has a 10 µF, 25 V capacitor C1 to ground and feeds the IN pin. A switch K connects VIN to the EN pin, and a 1 MΩ resistor R3 pulls EN to ground when the switch is open. The inductor L1 (22 µH) runs from VIN to the LX pin and to the anode of the Schottky diode D1 (SS34, 3 A, 40 V). The cathode of D1 is the output VOUT (12 V), which has a 10 µF, 25 V capacitor C4 to ground. The feedback divider is R1 (105 kΩ) from VOUT to the FB pin and R2 (12 kΩ) from FB to ground. The GND and PGND pins go to ground.</desc>
