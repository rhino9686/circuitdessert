<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 800 370" role="img" aria-labelledby="sy24640-t sy24640-d">
<title id="sy24640-t">SY24640 reference circuit</title>
<desc id="sy24640-d">Typical application of the SY24640 current-sense comparator, redrawn from the datasheet. A shunt resistor RSENSE sits between the supply (0–36 V) and the load. The supply side goes to the IN+ pin and the load side to the IN− pin. The VS pin takes 2.7–5.5 V with a bypass capacitor to ground. The open-drain ALERT output has a 10 kΩ pull-up resistor to VS and goes to a processor input. The ENABLE and LATCH pins are driven by processor outputs. The LIMIT pin has a resistor RLIMIT to ground, which sets the alert threshold with the pin's 20 µA current source, or it can instead be driven by a DAC. DELAY and HYS are left open, which selects the 10 µs response time and 2 mV of hysteresis. The GND pin goes to ground.</desc>
