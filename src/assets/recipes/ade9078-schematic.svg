<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 940 945" role="img" aria-labelledby="ade9078-t ade9078-d">
<title id="ade9078-t">ADE9078 test circuit</title>
<desc id="ade9078-d">Figure 27 of the ADE9078 data sheet, redrawn. The VDD pin is on 3.3 V with 10 µF and 0.1 µF to ground. The AVDDOUT pin and the DVDDOUT pin each have 4.7 µF and 0.1 µF to ground. RESET has a 10 kΩ resistor and a 1 µF capacitor, both from 3.3 V to the RESET line. Current channel A has a 1 kΩ resistor in each input line, and a 22 nF capacitor from each side to ground; channels B, C and N are marked "same as" channel A. On voltage channel A, VAN and VAP each have 1 kΩ in parallel with 22 nF to ground; channels B and C are marked "same as". CF2 drives an LED from a 3.3 V supply through 1 kΩ, and CF1 is marked "same as CF2". The REF pin has 4.7 µF and 0.1 µF to ground. A 12.288 MHz crystal sits between CLKIN and CLKOUT with 18 pF from each pin to ground. DGND, REFGND, AGND and GND join at one point that is grounded. PM0, PM1 and the SPI, pulse and interrupt pins are open terminals.</desc>
