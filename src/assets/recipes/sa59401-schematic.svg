<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 820 440" role="img" aria-labelledby="sa59401-t sa59401-d">
<title id="sa59401-t">SA59401 application schematic</title>
<desc id="sa59401-d">Application schematic of the SA59401 ADC, redrawn from the datasheet with the values from its bill of materials. VDD (2.7–5.5 V) feeds the VDD pin, with a 0.1 µF bypass capacitor CBYPASS to ground. Each analog input comes in through a 100 Ω series resistor (R1 on AIN0, R2 on AIN1, R3 on AIN2, R4 on AIN3). A 1 µF capacitor C1 connects across AIN0 and AIN1, and C4 across AIN2 and AIN3. Each input also has a 0.1 µF capacitor to ground: C2 on AIN0, C3 on AIN1, C5 on AIN2 and C6 on AIN3. SCLK, CS_N, DOUT/DRDY_N and DIN each connect to the controller through a 50 Ω series resistor (RSCLK, RCS_N, RDOUT and RDIN). GND goes to ground.</desc>
