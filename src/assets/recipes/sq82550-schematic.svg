<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 720 260" role="img" aria-labelledby="sq82550-t sq82550-d">
<title id="sq82550-t">SQ82550 application schematic</title>
<desc id="sq82550-d">Application schematic of the SQ82550 shunt voltage reference, redrawn from the datasheet with the values from its bill of materials. The input has a 1 µF capacitor C3 to ground and feeds the CATHODE pin through a 510 Ω resistor R2. ANODE goes to ground. The CATHODE is also the output, with a 10 µF capacitor C1 to ground and a position for a second capacitor C2, not fitted. The NC pin has a position for a resistor R1 to ground, not fitted.</desc>
