<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 1000 440" role="img" aria-labelledby="sq52201qdq-t sq52201qdq-d">
<title id="sq52201qdq-t">SQ52201QDQ reference circuit</title>
<desc id="sq52201qdq-d">Typical application of the SQ52201QDQ I2C power monitor, redrawn from the datasheet (Figures 1 and 4). A high-side shunt resistor RSHUNT, 2 mΩ in the datasheet's example, sits between a +12 V supply and the load. The supply side of the shunt goes to the IN+ pin and the load side to the IN- pin, and the VBUS pin is tied to the load side as well, so the bus voltage is read at the load. The VS pin takes 2.7 to 5.5 V and has a bypass capacitor CBYPASS to ground. SDA, SCL and ALERT are open-drain lines that each have a pull-up resistor (RSDA, RSCL, RALERT) to the VS rail and go to the host microcontroller. The A0 and A1 address pins and the GND pin are tied to ground, which gives the I2C address 1000000.</desc>
