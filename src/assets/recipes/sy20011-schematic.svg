<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 330" role="img" aria-labelledby="sy20011-t sy20011-d">
<title id="sy20011-t">SY20011 reference circuit</title>
<desc id="sy20011-d">Application schematic of the SY20011 buck converter for a 1.8 V output, redrawn from the datasheet with the values from its bill of materials. VIN (2.5–5.5 V) feeds the IN pin, with a 100 µF electrolytic capacitor CIN1 and a 10 µF ceramic CIN2 to ground. EN is fed from VIN through 1 kΩ (RENH) with 1 MΩ (RENL) to ground, and STB the same way through RSTBH and RSTBL, so both are high. The open-drain PG output is pulled up to VIN through 100 kΩ (RPG). LX drives a 2.2 µH inductor to the 1.8 V output, which has a 10 µF capacitor COUT. The OUT pin connects to the output at the capacitor. RH (10 MΩ) from OUT and RL (20 MΩ) to ground form the feedback divider to FB, with a 10 pF feedforward capacitor CFF across RH.</desc>
