<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 60 760 350" role="img" aria-labelledby="sy67134-t sy67134-d">
<title id="sy67134-t">SY67134 typical application</title>
<desc id="sy67134-d">Typical application of the SY67134 H-bridge motor driver, redrawn from the datasheet. The supply VM (5–32 V) feeds the VM pin, with a bulk electrolytic capacitor CBULK and a 10 µF ceramic capacitor CVM from VM to the GND pin, which goes to ground. IN1 and IN2 are logic inputs from a controller. An external reference voltage (0.1–3 V) drives VREF, which has a capacitor CREF (≥ 0.1 µF) to ground. A brushed DC motor connects between OUT1 and OUT2. ISEN goes to ground through the current-sense resistor RSENSE (&lt; 100 mΩ).</desc>
