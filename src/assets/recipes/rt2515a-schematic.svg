<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 800 300" role="img" aria-labelledby="rt2515a-t rt2515a-d">
<title id="rt2515a-t">RT2515A typical application circuit</title>
<desc id="rt2515a-d">Typical application circuit of the RT2515A adjustable 2 A LDO (Figure 1 of the datasheet). The input VIN feeds the VIN pin with a 10 microfarad capacitor C1 to ground, and the enable pin EN is driven by a separate Chip Enable signal. The VOUT pin is the output with a 10 microfarad capacitor C2 to ground. The feedback divider is R1 from VOUT to the ADJ pin and R2 from ADJ to ground, which set VOUT = 0.5 times (R1 + R2) divided by R2. The GND pin and exposed pad go to ground. The datasheet figure gives no resistor values.</desc>
