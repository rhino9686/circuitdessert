<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 1030 610" role="img" aria-labelledby="sy8388b-t sy8388b-d">
<title id="sy8388b-t">SY8388B typical application circuit</title>
<desc id="sy8388b-d">Typical application circuit of the SY8388B 8 A synchronous buck converter with a 3.3 V LDO, redrawn from the datasheet's Figure 1. The input rail VIN (4.5 V to 24 V) feeds the IN pins, with a 10 µF capacitor CIN and a 0.1 µF capacitor to ground. The EN1 and EN2 pins are driven by ON/OFF signals. The LX pin drives a 1.5 µH inductor L1 to the 3.338 V output, and a 0.1 µF bootstrap capacitor CBS connects BS to LX. The output has three 22 µF capacitors to ground. The OUT pin senses the output, and the FF pin connects to the output through a 1 kΩ resistor RFF in series with a 220 pF capacitor CFF. The open-drain PG output is brought out as a signal. The LDO pin is the 3.3 V LDO output with a 4.7 µF capacitor CLDO to ground. GND is tied to ground. The TEST pin is left floating or connected to ground and is not drawn.</desc>
