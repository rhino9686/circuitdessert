<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 60 840 1010" role="img" aria-labelledby="bq25190-t bq25190-d">
<title id="bq25190-t">BQ25190 charger and power-path PMIC, typical application</title>
<desc id="bq25190-d">Typical application of the BQ25190 redrawn from the datasheet's Figure 8-1. VBUS feeds IN, which has a 2.2 microfarad capacitor to ground. SDA, SCL and INT go to the host and are pulled up to BKOUT through three resistors; VPU is also connected to BKOUT. CE goes to the host. GPIO1 and GPIO2 are left open, and GPIO3 and GPIO4 are tied together and to ground. ADCIN is grounded. VINLS1 and VINLS2 are fed from SYS, each with a 2.2 microfarad capacitor; LSLDO1 and LSLDO2 each have a 1 microfarad output capacitor. The buck switch node BKSW goes through a 1 microhenry inductor to the BKOUT node, which has a 10 microfarad capacitor to ground and is wired back to the BKOUT pin. BKGND is grounded. The buck-boost has a 2.2 microhenry inductor between BBSW1 and BBSW2, a 22 microfarad capacitor on BBOUT, and BBGND is grounded. SYS has a 10 microfarad capacitor and feeds the system load. MR goes to a push-button to ground. BAT has a 1 microfarad capacitor and goes to the battery positive terminal. TS has a 10 kilohm resistor to ground in parallel with the battery pack thermistor. GND is grounded.</desc>
