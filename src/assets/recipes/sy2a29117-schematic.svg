<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 18 880 442" role="img" aria-labelledby="sy2a29117-t sy2a29117-d">
<title id="sy2a29117-t">SY2A29117 typical application</title>
<desc id="sy2a29117-d">Typical application of the SY2A29117 synchronous boost regulator, redrawn from the datasheet. The input VIN has a 10 µF capacitor CIN to ground, feeds the SVIN pin directly and connects through the 1 µH inductor L to the LX pin. A 100 nF bootstrap capacitor CBS connects BS to LX. The BD pin, the boost output before the disconnect switch, has a capacitor CBD (≥ 10 µF) to ground. The OUT pin, after the disconnect switch, is the output VOUT, with an output capacitor COUT to ground and the feedback divider R1 (200 kΩ) from OUT to FB and R2 from FB to the FGND pin. EN takes an on/off signal and BAT goes to ground. COMP has RZ in series with CZ to ground, VCC has CVCC (1 µF) to ground, SS has CSS to ground and ILIM has RILMT to ground. PGND and SGND go to ground.</desc>
