<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 800 400" role="img" aria-labelledby="sy2a27352-t sy2a27352-d">
<title id="sy2a27352-t">SY2A27352 reference circuit</title>
<desc id="sy2a27352-d">Application schematic of the SY2A27352 adjustable LDO with reset output, redrawn from the datasheet for a 3.3 V output. The input VIN (4–36 V) has a 10 µF, 50 V capacitor C1 to ground and feeds the IN pin. A switch K1 connects VIN to the EN pin, and a 1 MΩ resistor R5 pulls EN to ground when the switch is open. A 100 nF capacitor C3 from the TO pin to ground sets the reset timeout. The OUT pin is the output VOUT (3.3 V), which has a 4.7 µF, 50 V capacitor C2 to ground. The feedback divider is R1 (124 kΩ) from VOUT to the ADJ pin and R2 (27.4 kΩ) from ADJ to ground. The open-drain /RESET pin has a 10 kΩ pull-up resistor R3 to VOUT and is also brought out as the /RESET signal. The GND pin goes to ground.</desc>
