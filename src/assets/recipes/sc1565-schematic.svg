<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 800 300" role="img" aria-labelledby="sc1565-t sc1565-d">
<title id="sc1565-t">SC1565 typical application circuit</title>
<desc id="sc1565-d">Typical application circuit of the SC1565 adjustable 1.5 A LDO in its five-lead TO-220 or TO-263 package, redrawn from the datasheet. The input VIN feeds the VIN pin with an input capacitor C1 to ground, and the enable pin EN is driven by a separate ENABLE signal. The VO pin is the output with an output capacitor C2 to ground. The feedback divider is R1 from VO to the ADJ pin and R2 from ADJ to ground, which set VO = 1.200 times (R1 + R2) divided by R2. The GND pin goes to ground. The datasheet figure has no component values; the capacitor values are the ones its text recommends.</desc>
