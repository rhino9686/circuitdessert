<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 1400 680" role="img" aria-labelledby="sy50307-t sy50307-d" style="min-width:1150px">
<title id="sy50307-t">SY50307 reference circuit</title>
<desc id="sy50307-d">25 W USB PD charger built around the SY50307 GaN flyback controller, redrawn from Figure 13 of the datasheet with its designators. The AC input goes through the diode bridge BD1 to the bus capacitor C1, the filter L2 (with R1 across it) and the capacitor C2. The bus feeds the top of the transformer primary T1. A clamp made of C6 in parallel with R7, a resistor pair R8 and R9, and the diode D2 sits between the bus and the drain node. The controller U1 has its DRAIN pin on the bottom of the primary. Its SOURCE pin goes to ground through R5 in parallel with R6. An auxiliary winding feeds VCC through the diode D1 and the resistor R2, with the capacitors C3 and C4 on VCC. The resistor divider R3 and R4 from the auxiliary winding sets the VSEN pin. The COMP pin has the capacitor C5 and the phototransistor of the optocoupler OPTO1. On the secondary, the synchronous rectifier IC US1 is on the low side of the winding, with a snubber RS1 and CS1 across it. The output capacitor CS4 feeds VBUS. The optocoupler LED, its resistor, the TLV431 shunt regulator QS2 and a divider RS10 and RS8 regulate the output.</desc>
