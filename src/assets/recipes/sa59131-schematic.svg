<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 780 370" role="img" aria-labelledby="sa59131-t sa59131-d">
<title id="sa59131-t">SA59131 reference circuit</title>
<desc id="sa59131-d">Application schematic of the SA59131 current-sense amplifier, redrawn from the datasheet. A 10 mΩ sense resistor RSENSE sits in the current path. Its supply-side end goes to the IN+ pin and its load-side end to the IN− pin. The VS pin takes 2.7–5.5 V and has a 100 nF bypass capacitor CBYPASS to ground. The REF2 pin is tied to VS and the REF1 pin to ground, which puts the output at half the supply when no current flows, so the circuit reads current in both directions. The NC pin and the GND pin are tied to ground. The OUT pin is the output, a voltage of gain times the voltage across RSENSE added to that mid-supply level.</desc>
