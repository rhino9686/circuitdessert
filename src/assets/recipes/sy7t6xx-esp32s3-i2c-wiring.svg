<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 640 400" role="img" aria-labelledby="sy7t6xx-esp32s3-i2c-t sy7t6xx-esp32s3-i2c-d">
<title id="sy7t6xx-esp32s3-i2c-t">SY7T6xx wired to an ESP32-S3 over I2C</title>
<desc id="sy7t6xx-esp32s3-i2c-d">Wiring for talking to an SY7T6xx part from an ESP32-S3 dev board. Everything runs at 3.3 V, so no level shifter is needed. The board's 3V3 pin feeds the SY7T6xx and the pull-ups. ESP32-S3 GPIO9 (SCL) goes to DIO5 and GPIO8 (SDA) goes to both DIO3 (SDAo) and DIO2 (SDAi), which are tied together. Each of the two bus lines has a 4.7 kΩ pull-up to 3.3 V. DIO8, the interface select pin, has a 10 kΩ resistor to 3.3 V so it reads high at reset. RESETB (SY7T611 and SY7T612 only) has a 10 kΩ resistor to 3.3 V and can be pulled low by GPIO4. Both supply pins of the part go to 3.3 V and both grounds to ground.</desc>
