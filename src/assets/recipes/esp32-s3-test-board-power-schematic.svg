<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 960 382" role="img" aria-labelledby="esp32-s3-test-board-power-t esp32-s3-test-board-power-d">
<title id="esp32-s3-test-board-power-t">ESP32-S3 starter board: USB-C power input, 3.3 V regulator and USB protection</title>
<desc id="esp32-s3-test-board-power-d">A USB-C receptacle J1. Its VBUS pin runs through a 1 A polyfuse F1, a ferrite bead FB1 and a series diode D1 to the +5V rail. The +5V rail feeds the input of a 3.3 V linear regulator U2 with a 22 µF capacitor C1 to ground; the regulator output is the +3V3 rail with a 22 µF capacitor C2 to ground, and a green power LED D2 with a 1 kΩ resistor R3 from +3V3 to ground. CC1 and CC2 each go to ground through a 5.1 kΩ resistor (R1, R2). The D+ and D− pins go through the two pass-through channels of a USB ESD protection IC U3 to the nets D+ and D−, which continue on the module sheet. U3 has its VBUS pin on +5V with a 100 nF capacitor C3 to ground. The connector ground and shield go to ground.</desc>
