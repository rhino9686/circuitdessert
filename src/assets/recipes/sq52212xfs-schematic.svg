<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 1000 550" role="img" aria-labelledby="sq52212xfs-t sq52212xfs-d">
<title id="sq52212xfs-t">SQ52212XFS reference circuit</title>
<desc id="sq52212xfs-d">Typical application of the SQ52212XFS dual-channel I2C monitor, redrawn from the datasheet (Figure 1). Each channel has a high-side shunt resistor between its bus (0 to 70 V) and its load. The supply side of each shunt goes to the IN+ pin of that channel and the load side to its IN- pin, and each channel's VBUS pin is tied to the bus on the supply side of its shunt. The VS pin takes 2.7 to 5.5 V and has a bypass capacitor to ground. SDA, SCL and ALERT are open-drain lines with 2 kΩ pull-ups to the VS rail, going to the host. The EN pin comes from the host (high enables the part), and the A0 and A1 address pins and the GND pin are tied to ground, which gives the I2C address 1000000.</desc>
