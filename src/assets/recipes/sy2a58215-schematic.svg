<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 530" role="img" aria-labelledby="sy2a58215-t sy2a58215-d">
<title id="sy2a58215-t">SY2A58215 reference circuit</title>
<desc id="sy2a58215-d">Application schematic of the SY2A58215 H-bridge motor driver, redrawn from the datasheet. The battery supply VBAT (4–28 V) feeds the VCC pin, with a 100 µF, 50 V electrolytic capacitor E1 and three 10 µF, 50 V ceramic capacitors C1, C2 and C3 in parallel to ground. The four logic inputs PWM, INA, INB and SEL0 each reach their pin through a 1 kΩ series resistor (R4, R1, R2 and R3). The CS pin feeds a current-sense network: R7 (270 Ω) from CS to a junction, R8 (270 Ω) from the junction to ground, and R9 (4.7 kΩ) from the junction to the output that goes to the microcontroller's ADC, which has a 1 µF, 16 V capacitor C8 to ground. The OUTA and OUTB pins connect to a brushed DC motor, and each has a 100 nF, 50 V capacitor to ground (C4 and C5). GND goes to ground.</desc>
