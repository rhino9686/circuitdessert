<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 720 360" role="img" aria-labelledby="sy24642-t sy24642-d">
<title id="sy24642-t">SY24642 reference circuit</title>
<desc id="sy24642-d">Application schematic of the SY24642 current-sense amplifier, redrawn from the datasheet. A 10 mΩ sense resistor RSENSE sits in the current path. Its supply-side end goes to the CSP pin and its load-side end to the CSN pin. The VCC pin takes 3–5.5 V and has a 100 nF bypass capacitor CBYPASS to ground. The REF and GND pins are both tied to ground, which makes the output unidirectional: it is 0 V with no current and rises with the current. The OUT pin is the output, a voltage of gain times the voltage across RSENSE.</desc>
