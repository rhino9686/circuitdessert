<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 760 260" role="img" aria-labelledby="l5150bn-t l5150bn-d">
<title id="l5150bn-t">L5150BN typical application circuit</title>
<desc id="l5150bn-d">Application schematic of the L5150BN 5 V LDO, redrawn from the datasheet. The battery VBATT feeds the VS pin through two parallel input capacitors to ground, C1 (100 µF or more, the backup for negative pulses) and C2 (220 nF or more, for line disturbances). The Vo pin is the 5 V output with a ceramic output capacitor CO (220 nF suggested, ESR of 100 mΩ or more) to ground. The GND pin goes to ground.</desc>
