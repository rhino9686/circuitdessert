<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 600 300" role="img" aria-labelledby="sq82535-trim-t sq82535-trim-d">
<title id="sq82535-trim-t">SQ82535 output trim circuit</title>
<desc id="sq82535-trim-d">Output voltage adjustment circuit of the SQ82535, redrawn from the datasheet (Figure 3). A 10 kΩ potentiometer R1 in series with a 30 kΩ resistor R2 runs from VOUT to ground. The potentiometer's wiper connects through a 1 MΩ resistor R3 to the TRIM/NR pin. VIN feeds the VIN pin and GND goes to ground.</desc>
