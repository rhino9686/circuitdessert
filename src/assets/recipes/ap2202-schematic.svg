<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 800 290" role="img" aria-labelledby="ap2202-t ap2202-d">
<title id="ap2202-t">AP2202-2.8 typical application circuit</title>
<desc id="ap2202-d">Typical application circuit of the AP2202 fixed-output 150 mA LDO, redrawn from the datasheet for the 2.8 V version with a 3.8 V input. The input VIN feeds the VIN pin with a 1.0 microfarad capacitor CIN to ground, and the EN pin is wired to the input rail so the regulator is always enabled. The VOUT pin is the 2.8 V output with a 2.2 microfarad capacitor COUT to ground. A 100 picofarad capacitor CBYP goes from the BYP pin to ground. The GND pin goes to ground.</desc>
