<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 720 410" role="img" aria-labelledby="sa59401-esp32s3-spi-t sa59401-esp32s3-spi-d">
<title id="sa59401-esp32s3-spi-t">SA59401 wired to an ESP32-S3 over SPI</title>
<desc id="sa59401-esp32s3-spi-d">Wiring for talking to an SA59401 from an ESP32-S3 dev board. Everything runs at 3.3 V, so no level shifter is needed. The board's 3V3 pin feeds VDD, with a 0.1 µF bypass capacitor to ground. GPIO12 (SCK) goes to SCLK, GPIO11 (MOSI) to DIN and GPIO10 to CS_N, each through a 50 Ω resistor near the ESP32-S3. DOUT/DRDY_N goes to GPIO13 (MISO) through a 50 Ω resistor near the SA59401. The signal to measure connects to AIN0 (positive) and AIN1 (negative). AIN2 and AIN3 are left open. The grounds are joined.</desc>
