<text class="sch-pin" x="132" y="204" text-anchor="end">GPIO11 (MOSI)</text>
<path class="sch-w" d="M140 270 L152 270"/>
<text class="sch-pin" x="132" y="274" text-anchor="end">GPIO13 (MISO)</text>
<path class="sch-w" d="M140 330 L152 330"/>
