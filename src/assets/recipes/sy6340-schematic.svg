<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 800 290" role="img" aria-labelledby="sy6340-t sy6340-d">
<title id="sy6340-t">SY6340 typical application circuit</title>
<desc id="sy6340-d">Typical application circuit of the SY6340 adjustable 150 mA LDO, redrawn from Figure 1 of the datasheet. The input VIN feeds the IN pin with a 2.2 microfarad capacitor C2 to ground. The EN pin is driven by an enable signal. The OUT pin is the output VOUT with a 2.2 microfarad capacitor C3 to ground. A 100 kilohm resistor R1 runs from the output to the ADJ pin, with a 47 picofarad capacitor C4 in parallel with it, and a 22.1 kilohm resistor R2 runs from the ADJ pin to ground. The GND pin goes to ground. The datasheet text says this resistor pair sets 3.3 volts.</desc>
