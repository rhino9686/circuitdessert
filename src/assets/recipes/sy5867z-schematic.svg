<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 28 810 422" role="img" aria-labelledby="sy5867z-t sy5867z-d">
<title id="sy5867z-t">SY5867Z final circuit</title>
<desc id="sy5867z-d">Final circuit of the SY5867Z design example in its datasheet, redrawn. The VIN pin is fed from the supply (VSS) through RVIN, 1 kΩ, with CVIN, 1 nF, to ground. The ISET pin, a 2.21 V reference, feeds two dividers: RHCLP_U 13 kΩ and RHCLP_D 24 kΩ with CHCLP 10 nF set the HCLP pin, and RVLOW_U 33 kΩ and RVLOW_D 20 kΩ with CVLOW 10 nF set the VLOW pin. CFSET, 8.2 nF, from the FSET pin to ground sets the output frequency. The DIMO output goes to the net VDIMO. The DIMI pin goes to the dimming input through RDIMI, 100 Ω, with CDIMI, 100 pF, and a 12 V zener diode DDIMI to ground, and a diode DVIN from the DIMI node to the VIN node clamps DIMI to one diode drop above VIN. The GND pin is grounded.</desc>
