<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 890 520" role="img" aria-labelledby="sy6355-t sy6355-d">
<title id="sy6355-t">SY6355 typical application circuit</title>
<desc id="sy6355-d">Typical application circuit of the SY6355 DDR termination regulator, redrawn from Figure 1 of the datasheet. The VIN pin is fed from the 3.3 V rail with a 4.7 µF capacitor C6 to ground, and the same rail pulls up the open-drain PGOOD pin through a 100 kΩ resistor R3. The VDDQ rail reaches REFIN through R1 (10 kΩ), with R2 (10 kΩ) and C4 (1 nF) from REFIN to ground, and also feeds VLDOIN, which has two 10 µF capacitors C7 and C8 to ground. The enable pin EN is driven by the chip-enable signal; the figure also shows a 1 MΩ resistor R6 and a jumper K1 from the supply to EN, which are not drawn. VO is the termination output with three 10 µF capacitors C1 to C3 to ground, and VOSNS is wired to VO. REFOUT is the buffered reference output with a 0.1 µF capacitor C5 to ground. PGND and GND are tied to ground.</desc>
