<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 1080 580" role="img" aria-labelledby="sy23435-t sy23435-d" style="min-width:860px">
<title id="sy23435-t">SY23435 secondary-side USB PD and QC circuit</title>
<desc id="sy23435-d">Secondary side of a flyback USB PD charger with the SY23435 interface controller US2, redrawn from the datasheet's 25 W typical application with its designators. The flyback output VO+ feeds the VDD pins, which are the drain of the internal load switch, and the controller's VCC pin, which has the capacitor CS8 to ground. The output has the capacitors CS4 and CS3. The V3P3V pin has the capacitor CS9 to ground. The VBUS pin goes to the connector through the internal load switch, with the capacitor CS10 to the connector ground GNDS. The optocoupler LED OPTO1 is fed from VO+ through RS2, with RS5 in series with CS5 across it, and is driven by the OPTO pin. The OPTO pin has two compensation branches, RS7 in series with CS6 to the VFB pin and RS9 in series with CS7 to the IFB pin. The current-sense resistor RS3 sits in the return path between the output ground and GNDS, and the CS pin connects to the GNDS side. The Rcable pin has the resistor RS8 to ground. The CC1, CC2, DN and DP pins each go to the connector through a 20 ohm series resistor, with a 470 picofarad capacitor to GNDS on the controller side and a Zener diode to GNDS on the connector side.</desc>
