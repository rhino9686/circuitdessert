<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 700 250" role="img" aria-labelledby="sq52104e-t sq52104e-d">
<title id="sq52104e-t">SQ52104E reference circuit</title>
<desc id="sq52104e-d">Application schematic of the SQ52104E current-sense amplifier (gain 200 V/V), redrawn from the datasheet. A 10 mΩ sense resistor RSENSE sits in the high-side current path, between the supply (1.8–5.5 V) and the load. The supply side of RSENSE goes to the IN+ pin and the load side to the IN- pin. A 100 nF bypass capacitor CBYPASS from the IN+ node to ground sits next to the pin. The part has no separate supply pin, so the IN+ pin also powers it. The GND pin is grounded. The OUT pin is a voltage of gain times the voltage across RSENSE, referred to ground.</desc>
