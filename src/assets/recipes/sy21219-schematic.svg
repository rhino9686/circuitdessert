<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 954 302" role="img" aria-labelledby="sy21219-t sy21219-d">
<title id="sy21219-t">SY21219 reference circuit</title>
<desc id="sy21219-d">Typical application of the SY21219 buck converter. VIN (4.5–30 V) feeds the IN pin through 47 µF, 10 µF and 0.1 µF input capacitors. A 10 kΩ / 1 MΩ divider from VIN sets the enable level on EN. The open-drain PG output is pulled up to VIN through 100 kΩ. The 0.1 µF bootstrap capacitor connects BS to LX, and 2.2 µF on the VCC pin returns to AGND. LX drives a 4.7 µH inductor to the 5 V output, which has 3 output capacitors of 22 µF. RH (100 kΩ) and RL (13.7 kΩ) form the feedback divider to FB, with 1 kΩ in series with 220 pF across RH.</desc>
