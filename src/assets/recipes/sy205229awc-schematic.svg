<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 960 630" role="img" aria-labelledby="sy205229awc-t sy205229awc-d" style="min-width:800px">
<title id="sy205229awc-t">SY205229AWC USB ESD protection application</title>
<desc id="sy205229awc-d">USB application circuit of the SY205229AWC low-capacitance TVS, redrawn from the uncaptioned figure on page 6 of the datasheet. A USB controller and a USB port are joined by VBUS, D-, D+ and GND rows. The TVS sits above the D- row: pin 4 (VCC) to the VBUS row, pin 3 (I/O2) to the D- row, pin 2 (I/O1) to the D+ row, pin 1 (GND) to the GND row, with the pin 1 and pin 2 leads crossing the rows above them with no dot. Each data row has a shunt capacitor to GND next to the controller and a series resistor R_T after it. The body's internal network is drawn as printed.</desc>
