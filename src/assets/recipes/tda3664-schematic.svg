<title id="tda3664-t">TDA3664 typical application circuit</title>
<desc id="tda3664-d">Test circuit of the TDA3664 5 V regulator in the SO4 package, redrawn from the datasheet. The supply VP feeds pin 1 (VP). An optional 1 µF capacitor C1 from the supply to ground is drawn on a dashed connection. Pin 3 (REG) is the 5 V output VREG with a 10 µF capacitor C2 to ground. Pins 2 and 4 are both ground and are drawn once.</desc>
