<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 780 450" role="img" aria-labelledby="sa89853-esp32s3-spi-t sa89853-esp32s3-spi-d">
<title id="sa89853-esp32s3-spi-t">SA89853 wired to an ESP32-S3 over SPI</title>
<desc id="sa89853-esp32s3-spi-d">Wiring for talking to an SA89853 from an ESP32-S3 dev board. The board's 3V3 pin feeds VA and VBD, each with 10 µF and 0.1 µF to ground; all the grounds are joined. A 2.5 V reference drives REFP, with 10 µF from REFP to REFM, and REFM goes to ground. MXO connects to AINP, and AINM goes to ground. GPIO12 (SCK) goes to SCLK, GPIO11 (MOSI) to SDI and GPIO10 to CS_N. SDO goes to GPIO13 (MISO). The voltages to measure connect to CH0, CH1 and the other inputs, each through 33 Ω with 270 pF to ground, and must stay between 0 V and the 2.5 V reference.</desc>
