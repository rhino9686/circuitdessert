<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 800 320" role="img" aria-labelledby="ap2202-adj-t ap2202-adj-d">
<title id="ap2202-adj-t">AP2202-ADJ typical application circuit</title>
<desc id="ap2202-adj-d">Typical application circuit of the AP2202 adjustable 150 mA LDO, redrawn from the datasheet. The input VIN feeds the VIN pin with a 1.0 microfarad capacitor CIN to ground, and the EN pin is wired to the input rail so the regulator is always enabled. The VOUT pin is the output with a 2.2 microfarad capacitor COUT to ground. R1 runs from VOUT to the ADJ pin and R2 from ADJ to ground. An optional capacitor CBYP goes from the ADJ node to ground. The GND pin goes to ground. The datasheet prints the equation VOUT = 1.25 times (1 + R2 / R1) under the figure, which does not match the way the resistors are labelled in the drawing.</desc>
