<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 840 520" role="img" aria-labelledby="sy205229awc-pin-connections-t sy205229awc-pin-connections-d" style="min-width:700px">
<title id="sy205229awc-pin-connections-t">SY205229AWC pin connections in PCB</title>
<desc id="sy205229awc-pin-connections-d">Pin connections of the SY205229AWC in PCB, redrawn from Figure 2 on page 5 of the datasheet. The package is turned so pins 1 and 2 are on the left and pins 4 and 3 on the right. Two data lines run the full width, I/O1 above I/O2, with "To Connector" at the left end and "To Inner IC" at the right end. Pin 2 taps the I/O1 line and pin 3 crosses it to tap the I/O2 line. Pin 1 goes to a ground symbol and pin 4 to a VCC supply bar. Inside the body a zener diode joins the GND and VCC rails and each I/O node has a diode up to VCC and a diode down to GND.</desc>
