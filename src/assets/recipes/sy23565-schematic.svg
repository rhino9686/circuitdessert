<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 1040 530" role="img" aria-labelledby="sy23565-t sy23565-d" style="min-width:900px">
<title id="sy23565-t">SY23565 reference circuit</title>
<desc id="sy23565-d">Typical application of the SY23565 secondary-side-regulated flyback regulator, redrawn from Figure 1 of the datasheet with designators added. The AC input goes through a diode bridge BD to two bulk capacitors CBUS1 and CBUS2 in series. A 100 kΩ resistor RHV from the bus feeds the HV pin. The bus also feeds the top of the transformer primary. A snubber made of the capacitor CSN and resistor RSN in parallel, in series with the diode DSN, clamps the drain node across the primary. Both DRAIN pins connect to the bottom of the primary. A resistor RCS from the CS pin to ground senses the primary current. An auxiliary winding feeds VCC through a diode DVCC and a resistor RVCC, with a capacitor CVCC from VCC to ground. On the secondary, the diode DO and the output capacitor COUT produce VO+ and VO−. A resistor RLED, the LED of the optocoupler U1 and the shunt regulator U2 are in series across the output, with a divider R1 and R2 across the output setting the shunt regulator's reference. The optocoupler's phototransistor pulls the COMP pin down, with a capacitor CCOMP from COMP to ground.</desc>
