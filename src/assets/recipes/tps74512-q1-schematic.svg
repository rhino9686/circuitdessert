<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 800 290" role="img" aria-labelledby="tps74512-q1-t tps74512-q1-d">
<title id="tps74512-q1-t">TPS74512-Q1 typical application circuit</title>
<desc id="tps74512-q1-d">Typical application circuit of the TPS74512-Q1 fixed-voltage LDO with power-good, redrawn from the datasheet. The input VIN feeds the IN pin and is also wired to the EN pin, so the regulator is always enabled. An input capacitor CIN (2.2 µF) goes to ground. The OUT pin is the output VOUT (1.2 V) with an output capacitor COUT (2.2 µF) to ground. The open-drain PG pin has a pull-up resistor RPG (10–100 kΩ) to VOUT and is also brought out as the power-good signal. The GND pin goes to ground.</desc>
