<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 890 490" role="img" aria-labelledby="tps51206-t tps51206-d">
<title id="tps51206-t">TPS51206 typical application circuit</title>
<desc id="tps51206-d">Typical application circuit of the TPS51206 DDR termination regulator with VLDOIN tied to VDDQ, redrawn from the datasheet's Figure 24. The VDDQ rail feeds both VLDOIN and VDDQSNS, with a 10 µF capacitor C1 to ground. The S3 and S5 pins take the sleep-state signals, and the VDD pin takes a 5 V or 3.3 V supply with a 0.1 µF capacitor C2 to ground. VTT is the termination output with a 10 µF capacitor C3 to ground, and VTTSNS is wired to VTT. VTTREF is the buffered reference output with a 0.22 µF capacitor C4 to ground. PGND and GND, with the thermal pad, are tied to ground.</desc>
