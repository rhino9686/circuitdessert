<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 120 800 310" role="img" aria-labelledby="tps7a8101-q1-t tps7a8101-q1-d">
<title id="tps7a8101-q1-t">TPS7A8101-Q1 typical application circuit</title>
<desc id="tps7a8101-q1-d">Typical application circuit of the TPS7A8101-Q1 adjustable LDO, redrawn from the datasheet with the recommended values for a 3.3 V output. The input VI feeds the IN pin; an input capacitor CIN (10 µF) to ground is connected to it by a dashed line, as in the datasheet. The enable pin EN is driven by a separate signal VEN. The OUT pin is the output VO, which has an output capacitor COUT (10 µF) to ground. The feedback divider is R1 (30.9 kΩ) from VO to the FB/SNS pin and R2 (10 kΩ) from FB/SNS to ground, and a bypass capacitor CBYPASS (470 nF) sits across R1. The noise-reduction capacitor CNR (470 nF) connects from the NR pin to ground. The GND pin goes to ground.</desc>
