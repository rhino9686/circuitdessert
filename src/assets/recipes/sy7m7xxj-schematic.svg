<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 650" role="img" aria-labelledby="sy7m7xxj-t sy7m7xxj-d">
<title id="sy7m7xxj-t">SY7M713J supply, crystal and battery connections</title>
<desc id="sy7m7xxj-d">Supporting circuit of the SY7M713J metering SoC in its 100-pin package, built from the datasheet tables. V3P3A and V3P3SYS come from the same 3.3 V supply and each has a 1.0 microfarad ceramic capacitor to ground. V3P3D has 0.1 microfarad, VDD 1.0 microfarad, V3P3RTC 1.0 microfarad and VLCD 0.1 microfarad, each to ground. A 32.768 kilohertz crystal sits between XIN and XOUT with a 22 picofarad capacitor from XIN and a 33 picofarad capacitor from XOUT to ground. Battery 1 is on VBAT and battery 2 on VBAT_RTC. RST, TEST and WAKE_COMP are tied to ground, and GNDA and GNDD join one ground. The current and voltage sensor inputs are not drawn.</desc>
