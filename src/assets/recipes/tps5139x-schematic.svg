<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 1030 520" role="img" aria-labelledby="tps5139x-t tps5139x-d">
<title id="tps5139x-t">TPS51393 and TPS51395 typical application circuit</title>
<desc id="tps5139x-d">Typical application circuit of the TPS51393 and TPS51395 8 A synchronous buck converter, redrawn from the datasheet's Figure 11 (the TPS51395, 5.1 V output). The input rail feeds the VIN pins, with two 22 µF capacitors C3 and C4 and a 0.1 µF capacitor C5 to ground. The EN and ENLDO pins are driven by enable signals. A 1 µF capacitor C1 sits on the VCC pin. The SW pin drives a 1.5 µH inductor L1 to the output, and a bootstrap capacitor C12 (0.1 µF) with a 0 Ω resistor R2 in series connects BOOT to SW. The VOUT pin senses the output, which has four 22 µF capacitors (C8 to C11) and a 0.1 µF capacitor C6 to ground. The FB pin connects to the output through a 240 kΩ resistor R13 in parallel with a 470 pF capacitor C13. The open-drain PGOOD pin has a 100 kΩ pull-up R1 to VCC. The 100 mA LDO output has a 4.7 µF capacitor C16 to ground, and PGND is tied to ground.</desc>
