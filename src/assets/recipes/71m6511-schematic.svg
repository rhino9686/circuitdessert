<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 960 740" role="img" aria-labelledby="71m6511-t 71m6511-d">
<title id="71m6511-t">71M6511 basic connections</title>
<desc id="71m6511-d">A basic-connections drawing for the 71M6511, put together from several figures of its data sheet because the data sheet has no complete application circuit. V3P3A, V3P3D and VBAT are on one 3.3 V rail; V3P3A and V3P3D each have 0.1 µF to ground, and VBAT goes to the same rail when no battery is used. A current sensor (a current transformer with a burden resistor, a shunt or a Rogowski coil) connects to IA with its return on V3P3. A resistive divider, Rin from the line voltage and Rout to V3P3, connects to VA. V1 is fed from a divider: R1 from the supply to be monitored, R2 to ground, then 10 kΩ in series and 100 pF to ground at the pin, with a header jumper across R1 for debugging. RESETZ has 200 Ω to 3.3 V, 1 nF to ground, and a pushbutton through 10 Ω to ground. TEST goes to ground. A 32.768 kHz crystal sits between XIN and XOUT with 22 pF from each pin to ground. VBIAS has 1000 pF, VREF 0.1 µF and V2P5 0.1 µF to ground. For a 5 V LCD, VDRV drives a 33 nF coupling capacitor and two diodes from 3.3 V that charge a reservoir capacitor of 0.22 µF or more on VLCD. GNDA and GNDD join at one ground. The LCD, DIO, UART, optical and emulator pins and IB are not drawn.</desc>
