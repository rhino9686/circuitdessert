<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 790 420" role="img" aria-labelledby="ina240-solenoid-t ina240-solenoid-d">
<title id="ina240-solenoid-t">INA240-Q1 solenoid drive current-sense circuit</title>
<desc id="ina240-solenoid-d">Solenoid drive current-sense circuit redrawn from the INA240-Q1 datasheet, Figure 9-5. A 12 V supply, as the figure prints it, feeds the drain of a high-side N-channel MOSFET whose gate is the Control input. The source goes through a 10 milliohm shunt resistor to the solenoid, whose other end is grounded. A freewheeling diode runs from ground to the MOSFET source, which is the top end of the shunt, so the solenoid current keeps flowing down through the shunt after the switch opens. The top end of the shunt goes to the IN+ pin and the bottom end to the IN- pin of the INA240-Q1. The VS pin takes 5 V. REF2 is tied to VS and REF1 to ground, so the output rests at half the supply. The OUT pin is the output. GND is grounded.</desc>
