<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 890 520" role="img" aria-labelledby="rt2568-t rt2568-d">
<title id="rt2568-t">RT2568 typical application circuit</title>
<desc id="rt2568-d">Typical application circuit of the RT2568 DDR termination regulator, redrawn from the datasheet. The VIN pin is the termination supply, with two 10 µF capacitors C1 and C2 to ground; a 10 kΩ resistor R1 runs from that supply to REFIN, which has a 10 kΩ resistor R2 and a 1 nF capacitor C3 to ground. The enable pin EN is driven by a chip-enable signal. The VCNTL pin is the control supply with a 4.7 µF capacitor C5 to ground, and a 100 kΩ pull-up R3 from VCNTL to the open-drain PGOOD pin. VOUT is the termination output with three 10 µF capacitors C6 to C8 to ground, and SENSE is wired to VOUT. REFOUT is the buffered reference output with a 0.1 µF capacitor C4 to ground. PGND and GND are tied to ground.</desc>
