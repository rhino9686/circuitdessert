<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 800 360" role="img" aria-labelledby="ncp133-t ncp133-d">
<title id="ncp133-t">NCP133 typical application circuit</title>
<desc id="ncp133-d">Typical application circuit of the NCP133 adjustable version, redrawn from the datasheet with the resistor values of its Table 1 for a 1.0 V output. The input VIN feeds the IN pin with a 1 microfarad capacitor CIN to ground. A separate bias supply VBIAS feeds the BIAS pin with a 100 nanofarad capacitor CBIAS to ground, and the enable pin EN is driven by a separate signal. The OUT pin is the output VOUT with a 2.2 microfarad capacitor COUT to ground. The feedback divider is R1 (19.6 kilohms) from VOUT to ADJ and R2 (78.7 kilohms) from ADJ to ground. The GND pin goes to ground.</desc>
