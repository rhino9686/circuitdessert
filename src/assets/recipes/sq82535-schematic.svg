<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 720 270" role="img" aria-labelledby="sq82535-t sq82535-d">
<title id="sq82535-t">SQ82535 application schematic</title>
<desc id="sq82535-d">Application schematic of the SQ82535 series voltage reference, redrawn from the datasheet with the values from its bill of materials. The input VIN feeds the VIN pin, with a 1 µF capacitor C1 to ground. GND goes to ground. The VOUT pin is the reference output, with a 10 µF capacitor C2 and a 0.1 µF capacitor C3 to ground. The TRIM/NR pin has a 0.1 µF noise-reduction capacitor C4 to ground. The TEMP pin is not used.</desc>
