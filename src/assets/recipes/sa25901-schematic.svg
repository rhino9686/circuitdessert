<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 60 820 232" role="img" aria-labelledby="sa25901-t sa25901-d">
<title id="sa25901-t">SA25901BAT reference circuit</title>
<desc id="sa25901-d">Typical application of the SA25901BAT buck converter. VIN (2.8–6.0 V) feeds the IN pin through 47 µF and 10 µF input capacitors. The EN and MODE pins are connected directly to VIN, which selects forced PWM. The open-drain PG output is pulled up to VIN through 10 kΩ. LX drives a 1.0 µH inductor to the 1.2 V output, which has 2 × 10 µF of output capacitance. RTOP (51 kΩ) and RBOT (51 kΩ) form the feedback divider to FB, with a 22 pF feedforward capacitor across RTOP.</desc>
