<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 90 840 340" role="img" aria-labelledby="sy87004a-t sy87004a-d">
<title id="sy87004a-t">SY87004A typical application</title>
<desc id="sy87004a-d">Typical application of the SY87004A boost regulator with bypass mode, redrawn from the datasheet's Schematic (page 13). The battery, 1.9 to 5.5 V, has a 100 µF electrolytic, a 22 µF and a 0.1 µF capacitor to ground, feeds the VIN pin, and feeds a 0.47 µH inductor L1 that goes to the LX pin. The EN pin is driven from the battery through a switch k, with a 1 MΩ resistor R4 from EN to ground. The VOUT pin, 2.85 to 5.5 V, has four 10 µF capacitors to ground. The ADDR pin is pulled high, pulled low or left floating to choose the I2C address, and the SDA and SCL pins go to the I2C bus.</desc>
