<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 880 450" role="img" aria-labelledby="bq25171-q1-t bq25171-q1-d">
<title id="bq25171-q1-t">BQ25171-Q1 typical application circuit</title>
<desc id="bq25171-q1-d">Typical application circuit of the BQ25171-Q1 standalone linear battery charger, redrawn from the datasheet's Figure 8-1 for single-cell LiFePO4 charging at 500 mA from a 5 V input. The input VIN feeds the IN pin with a 1 µF capacitor CIN to ground. Three pull-down resistors set the charger: 100 kΩ from CHM_TMR to ground (5 hour safety timer), 82 kΩ from VSET to ground (3.6 V charge voltage) and 600 Ω from ISET to ground (500 mA). The OUT pin is the battery and system rail with a 1 µF capacitor COUT to ground. The open-drain STAT1 and STAT2 pins each drive an LED, with a 10 kΩ resistor from the LED to the OUT rail. A 10 kΩ NTC thermistor goes from the TS pin to ground, and the active-low CE pin is driven by an open-drain host output. The GND pin goes to ground.</desc>
