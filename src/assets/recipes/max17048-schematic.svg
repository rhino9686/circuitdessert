<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 780 360" role="img" aria-labelledby="max17048-t max17048-d">
<title id="max17048-t">MAX17048 reference circuit</title>
<desc id="max17048-d">Application circuit of the MAX17048 fuel gauge on a 1S battery pack, redrawn from the datasheet. The pack positive terminal goes to both the VDD and CELL pins, with a 0.1 µF capacitor from that node to ground. CTG, GND and the pack negative terminal are on ground, QSTRT is on ground, and ALRT, SDA and SCL go to the interrupt input and the I2C pins of the system microcontroller.</desc>
