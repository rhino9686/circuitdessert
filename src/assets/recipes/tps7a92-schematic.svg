<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 840 360" role="img" aria-labelledby="tps7a92-t tps7a92-d">
<title id="tps7a92-t">TPS7A92 typical application circuit</title>
<desc id="tps7a92-d">Typical application circuit of the TPS7A92 2 A low-noise LDO, redrawn from the datasheet's Figure 7-2 for a 1.2 V output from a 2.0 V input. The input VIN feeds the IN pin with an input capacitor CIN (22 µF) to ground, and the EN and SS_CTRL pins are both wired to the input rail. A noise-reduction and soft-start capacitor CNR/SS (100 nF) goes from the NR/SS pin to ground. The OUT pin is the output VOUT with an output capacitor COUT (22 µF) to ground. The feedback divider is R1 (5.9 kΩ) from VOUT to the FB pin and R2 (11.8 kΩ) from FB to ground, with a feed-forward capacitor CFF (10 nF) across R1. The open-drain PG pin has a pull-up resistor RPG (20 kΩ) to VOUT and is brought out as the power-good signal. The GND pin goes to ground.</desc>
