<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 680 420" role="img" aria-labelledby="sy87004a-esp32s3-i2c-t sy87004a-esp32s3-i2c-d">
<title id="sy87004a-esp32s3-i2c-t">SY87004A wired to an ESP32-S3 over I2C</title>
<desc id="sy87004a-esp32s3-i2c-d">Wiring for talking to an SY87004A from an ESP32-S3 dev board. The board's 3V3 pin feeds only the two pull-ups. ESP32-S3 GPIO9 (SCL) goes to the SCL pin and GPIO8 (SDA) to the SDA pin, each with a 4.7 kΩ pull-up to 3.3 V. The ADDR pin is tied to ground, which selects the address 0x75. The EN pin is joined to the battery through a jumper and has a 1 MΩ resistor to ground. The regulator's own supply, the battery, goes to VIN and the grounds of the board and the regulator are joined. The inductor and capacitors are as in the application circuit.</desc>
