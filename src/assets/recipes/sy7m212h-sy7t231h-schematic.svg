<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 14 1000 866" role="img" aria-labelledby="sy7m212h-sy7t231h-t sy7m212h-sy7t231h-d">
<title id="sy7m212h-sy7t231h-t">SY7M212H dual-phase application with current transformers</title>
<desc id="sy7m212h-sy7t231h-d">The "Typical Application Circuit (SY7M212H with CTs)" of the SY7M212H / SY7T231H data sheet, redrawn with the values of its Recommended External Components table. Phase A and phase B each pass through a current transformer whose secondary goes to IAP and IAN, or IBP and IBN. A resistor divider from each phase to neutral goes to VA or VB. Neutral is the circuit ground and is joined to GNDA and GNDD. A power-supply block feeds V3P3A and V3P3SYS, which are tied together, with 1.0 µF at each. V3P3D has 0.1 µF. A 32.768 kHz crystal sits across XIN and XOUT with 20 pF from each pin to ground. VBAT goes to a battery and VBAT_RTC to an RTC battery. VDD has 1.0 µF, VLCD 0.1 µF and V3P3RTC 1.0 µF. WAKE_COMP is an open terminal. The data sheet draws no burden resistor, no filter and no divider values.</desc>
