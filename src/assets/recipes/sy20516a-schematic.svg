<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 810 510" role="img" aria-labelledby="sy20516a-t sy20516a-d">
<title id="sy20516a-t">SY20516A application schematic, 3.3 V output</title>
<desc id="sy20516a-d">Application schematic of the SY20516A buck-boost converter with a 3.3 V output, redrawn from the datasheet. VIN (2.6 to 5.5 V) feeds the PVIN pin and has two 22 µF capacitors, C2 and C3, to ground. R7 (0 Ω) joins VIN to the SVIN pin, which has C11 (1 µF) to ground. The OUT pin is the output VOUT (2.6 to 3.8 V) with two 22 µF capacitors, C4 and C5, to ground. The feedback divider R1 (100 kΩ) from VOUT to FB and R2 (22.1 kΩ) from FB to ground sets 3.3 V. EN has R4 (1 MΩ) to ground and a switch K1 to VIN. COMP has R3 (20 kΩ) in series with C8 (2.2 nF) to ground. SGND and the exposed GND pad go to ground. The 2.2 µH inductor L1 connects LX1 to LX2. PGND goes to ground. PG, an open-drain output, has R6 (100 kΩ) to VIN. ISET has R5 (150 kΩ) and C7 (10 nF) in parallel to ground, SS has C6 (20 nF) to ground, and NC is not connected.</desc>
