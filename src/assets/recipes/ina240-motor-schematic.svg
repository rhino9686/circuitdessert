<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 860 460" role="img" aria-labelledby="ina240-motor-t ina240-motor-d">
<title id="ina240-motor-t">INA240-Q1 inline motor current-sense circuit</title>
<desc id="ina240-motor-d">Inline motor current-sense circuit redrawn from the INA240-Q1 datasheet, Figure 9-3. A 40 V supply feeds a three-phase bridge of six switches, one pair per phase, with the switches drawn as transistor symbols and no drive shown. The first phase reaches the motor through a 100 milliohm shunt resistor, and the other two phases go straight to the motor. The shunt end nearest the bridge goes to the IN+ pin of the INA240-Q1 and the end nearest the motor to the IN- pin. The VS pin takes 5 V. REF2 is tied to VS and REF1 to ground, so the output rests at half the supply and can follow current in both directions. The OUT pin is the output. GND is grounded.</desc>
