<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 90 840 340" role="img" aria-labelledby="sy87004-t sy87004-d">
<title id="sy87004-t">SY87004 typical application</title>
<desc id="sy87004-d">Typical application of the SY87004 boost regulator with bypass mode, redrawn from the datasheet's Figure 1. The input, 1.9 to 5.5 V, has a 100 µF and a 22 µF capacitor to ground, feeds the VIN pin, and feeds a 0.47 µH inductor L1 that goes to the LX pin. The EN pin is driven by an ON/OFF signal. The VOUT pin, 2.85 to 5.5 V, has a capacitor COUT drawn as 10 µF times four to ground. The ADDR pin is pulled high, pulled low or left floating to choose the I2C address, and the SDA and SCL pins go to the I2C bus.</desc>
