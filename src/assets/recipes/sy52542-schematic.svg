<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 1000 430" role="img" aria-labelledby="sy52542-t sy52542-d" style="min-width:760px">
<title id="sy52542-t">SY52542 low-side synchronous rectifier circuit</title>
<desc id="sy52542-d">Secondary side of a flyback converter with the SY52542 synchronous rectification switcher U1 in the low-side position, redrawn from the datasheet's typical application with its designators. The top of the transformer secondary winding T1 goes to the positive output rail VO+. The bottom of the winding goes to the DRAIN pins of U1, and its SOURCE pins go to the negative output rail VO−. An RC snubber, the resistor RS1 in series with the capacitor CS1, is connected from the drain node to the source rail. The VIN pin is connected to VO+ through the resistor RS2, and has the capacitor CS2 to the source rail. The VDD pin has the capacitor CS3 to the source rail. Two output capacitors CS4 and CS5 sit between VO+ and VO−.</desc>
