<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 900 450" role="img" aria-labelledby="sy2a29311-t sy2a29311-d">
<title id="sy2a29311-t">SY2A29311 reference circuit</title>
<desc id="sy2a29311-d">Typical schematic of the SY2A29311 buck-boost converter, redrawn from the datasheet. The input VIN (4–36 V) has a 22 µF capacitor CIN to ground and feeds the IN pin. A divider of REN1 (10 kΩ) from VIN and REN2 (1 MΩ) to ground drives EN. RFS (100 kΩ) from FS to ground sets the switching frequency, and SYNC/MODE goes to a control signal. PG is an open-drain output. The inductor L1 (2.2 µH) connects LX1 and LX2, with a 100 nF bootstrap capacitor from BS1 to LX1 (CBS1) and from BS2 to LX2 (CBS2). The OUT pin has COUT (3 × 22 µF) to ground and connects through the current-sense resistor RSENSE (20 mΩ) to the output VOUT (12 V). ISP connects to the OUT side of RSENSE and ISN to the VOUT side. The feedback divider is RFB1 (110 kΩ) from VOUT to FB and RFB2 (10 kΩ) from FB to ground. COMP has CP (10 pF) to ground in parallel with RZ (82 kΩ) in series with CZ (2.2 nF). VCC has CVCC (2.2 µF) to ground, SS has CSS (10 nF) to ground, and GND goes to ground.</desc>
