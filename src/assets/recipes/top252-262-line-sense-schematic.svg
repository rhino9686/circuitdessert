<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 480 310" role="img" aria-labelledby="top252-262-line-sense-t top252-262-line-sense-d">
<title id="top252-262-line-sense-t">TOPSwitch-HX line sense and external current limit</title>
<desc id="top252-262-line-sense-d">Line sense and external current limit, redrawn from Figure 5 of the TOP252-262 datasheet. The DC input voltage's positive terminal goes through the 4 megohm resistor RLS to the V pin. The X pin goes through the 12 kilohm resistor RIL to the negative rail, and the S pin goes straight to the negative rail. The D and C pins are drawn dashed: nothing is shown on them.</desc>
