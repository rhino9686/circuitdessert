<circle class="sch-dot" cx="240" cy="60" r="3"/>
<path class="sch-w" d="M240 60 L240 90 L234 92.5 L246 97.5 L234 102.5 L246 107.5 L234 112.5 L246 117.5 L240 120 L240 150"/>
<text class="sch-ref" x="256" y="103" text-anchor="start">R<tspan class="sch-sub" dy="2.5">LS</tspan></text>
<text class="sch-val" x="256" y="116" text-anchor="start">4 MΩ</text>
<path class="sch-w" d="M240 150 L240 178"/>
<rect class="sch-ic" x="160" y="190" width="160" height="70" rx="3"/>
