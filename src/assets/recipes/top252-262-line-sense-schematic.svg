<text class="sch-pin" x="190" y="252" text-anchor="middle">S</text>
<path class="sch-w" d="M240 260 L240 272"/>
<text class="sch-pin" x="240" y="252" text-anchor="middle">X</text>
<text class="sch-ictitle" x="240" y="229" text-anchor="middle">TOPSwitch-HX</text>
<line class="sch-w" stroke-dasharray="4 3" x1="190" y1="178" x2="190" y2="140"/>
<line class="sch-w" stroke-dasharray="4 3" x1="332" y1="219" x2="390" y2="219"/>
<path class="sch-w" d="M190 272 L190 320"/>
