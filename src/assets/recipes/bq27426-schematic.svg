<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 900 530" role="img" aria-labelledby="bq27426-t bq27426-d">
<title id="bq27426-t">BQ27426 fuel gauge with a high-side sense resistor</title>
<desc id="bq27426-d">Typical application of the BQ27426 single-cell fuel gauge redrawn from the datasheet's Figure 8-1. The host supply EXT_VCC feeds three pull-up resistors: 10 kilohm to SDA, 10 kilohm to SCL and 5.1 kilohm to GPOUT. The BIN pin goes to the battery pack thermistor and also has a 1.8 megohm resistor to the 1.8 volt VDD output. VDD is decoupled with 0.47 and 2.2 microfarad capacitors. The BAT pin connects to the pack positive terminal, with a 1 microfarad capacitor to ground. A 10 milliohm sense resistor sits in the positive path between the pack and the load: SRP connects on the pack side and SRN on the load side. VSS and the pack negative terminal are ground.</desc>
