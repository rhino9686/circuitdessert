<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 60 760 700" role="img" aria-labelledby="sy67134-tank-drive-t sy67134-tank-drive-d">
<title id="sy67134-tank-drive-t">SY67134 two-motor drive</title>
<desc id="sy67134-tank-drive-d">Two SY67134 H-bridge motor drivers, one for each motor of a tracked robot. Each driver has its VM pin on the shared motor supply net VM, with a 100 µF electrolytic capacitor CBULK and a 10 µF ceramic capacitor CVM from VM to ground. The VREF pins of both drivers go to one shared reference voltage net VREF, and each has its own 0.1 µF capacitor CREF to ground. IN1 and IN2 of each driver come from a controller (nets IN1L and IN2L for the left driver U1, IN1R and IN2R for the right driver U2). A brushed DC motor connects between OUT1 and OUT2 of each driver (M1 on the left, M2 on the right). ISEN of each driver goes to ground through a 50 mΩ current-sense resistor (RSENSE1 and RSENSE2). The supply and the reference voltage are not specified.</desc>
