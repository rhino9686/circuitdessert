<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="sy20718c-t sy20718c-d">
<title id="sy20718c-t">SY20718C reference circuit</title>
<desc id="sy20718c-d">Application circuit of the SY20718C bidirectional power bank regulator. The adapter input VIN (4.5–5.35 V) has a 10 µF capacitor and a 36 kΩ / 13 kΩ divider that sets the VDPM input-voltage threshold. 0.75 kΩ, 2.55 kΩ and 2.2 kΩ resistors from IIN, ICHG and ISYS to ground set the input, charge and boost current limits. The CV1 jumper selects the cell voltage: ground for 4.2 V, or 10 kΩ to SYS for 4.35 V. STAT drives an LED through 5.1 kΩ, powered from the higher of SYS and BAT through the D2 diode pair. The SYS pin has two 22 µF capacitors and is the 5.15 V output. LX drives a 1.5 µH inductor to the battery node BAT, which has 10 µF and 1 µF capacitors. OTGB is pulled up to BAT through 100 kΩ; pulling it low enables boost. DP and DM reach the output port through 0 Ω resistors with 5.1 V zener diodes to ground. A 10 nF capacitor and 2.2 Ω resistor in series from LX to ground form a snubber.</desc>
