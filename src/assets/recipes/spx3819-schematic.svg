<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 800 290" role="img" aria-labelledby="spx3819-t spx3819-d">
<title id="spx3819-t">SPX3819 typical application circuit</title>
<desc id="spx3819-d">Standard application circuit of the SPX3819 500 mA low-noise LDO, redrawn from the datasheet's Figure 18. The input VIN feeds the VIN pin with an input capacitor CIN to ground. The EN pin is driven by an enable signal and can be tied to VIN. The VOUT pin is the output with an output capacitor COUT to ground, and the optional bypass capacitor CBYP goes from the BYP pin to ground. The GND pin goes to ground.</desc>
