<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 880 690" role="img" aria-labelledby="sy6862f-t sy6862f-d">
<title id="sy6862f-t">SY6862F reference circuit</title>
<desc id="sy6862f-d">Application circuit for the SY6862F two-to-one USB PD power mux, redrawn from the datasheet. VCHG comes from the charger path through a 10 µF capacitor C1, V5V from the 5 V rail through a 10 µF capacitor C3, and VBAT through a 1 µF capacitor C6. VBUS goes to the Type-C connector with a 10 µF capacitor C2 and a TVS diode D1 to ground. HOST_CC1 and HOST_CC2 go to the PD controller, and CONN_CC1 and CONN_CC2 go to the connector, each with a 330 pF capacitor (C4, C5) and a TVS diode (D2, D3) to ground. SDA, SCL and ALERT_L have pull-up resistors R4, R3 and R5 to VIO, EN and FRS_EN have 1 MΩ pull-down resistors R1 and R2, and a 0 Ω resistor R6 ties ADDR to ground.</desc>
