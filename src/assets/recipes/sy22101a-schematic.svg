<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 820 330" role="img" aria-labelledby="sy22101a-t sy22101a-d">
<title id="sy22101a-t">SY22101A typical application</title>
<desc id="sy22101a-d">Typical application of the SY22101A boost LED driver, redrawn from the datasheet's Figure 1. VIN feeds the IN pin and a 10 µH inductor, with a 1 µF capacitor to ground. The inductor's other end is the LX pin, which drives a Schottky diode D to the output. The output has a 1 µF capacitor to ground and connects to the OVP pin. A series string of LEDs runs from the output down to the FB pin, and a sense resistor R1 from FB to ground sets the LED current. A PWM dimming signal drives the EN/PWM pin.</desc>
